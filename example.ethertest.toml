[chain]
chain_id = 1337
# Zero inherits the effective chain ID, including one imported from genesis.
network_id = 0
# genesis = "genesis.json"
genesis_time = 1800000000
slot_duration = "6s"
slots_per_epoch = 8
validators = 64
gas_limit = 30000000

[chain.forks]
cancun_epoch = 0
prague_epoch = 0
osaka_epoch = 0
# 0 = genesis, positive = activation epoch, -1 = disabled
amsterdam_epoch = 0

[mining]
mode = "transaction"
order = "fees"

[http]
enabled = true
address = "127.0.0.1:8545"
cors = ["*"]

[ipc]
enabled = false
path = "ethertest.ipc"

[beacon]
enabled = true

[storage]
engine = "memory"
archive = true

[limits]
max_request_bytes = 16777216
max_batch_items = 1000
max_response_bytes = 67108864
max_control_operations = 256
max_log_blocks = 10000
max_log_results = 10000
rpc_gas_cap = 50000000
trace_timeout = "5s"
max_filters = 1024
max_subscriptions = 1024
filter_timeout = "5m"

[log]
level = "info"
json = false
progress_interval = "10s"
