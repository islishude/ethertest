version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  relative-path-mode: gomod
  tests: true

linters:
  default: standard
  enable:
    - modernize
  exclusions:
    generated: strict
    rules:
      - linters:
          - staticcheck
        text: 'SA1019: .*\.D has been deprecated since Go 1\.26'

formatters:
  enable:
    - gofmt
  exclusions:
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
