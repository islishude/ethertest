openapi: 3.0.3
info:
  title: ethertest Beacon API contract subset
  version: 0.1.0
  description: >
    Paths implemented from ethereum/beacon-APIs v4.0.0. Upstream schemas remain
    authoritative; this narrow offline contract records the supported surface.
paths:
  /eth/v1/beacon/genesis: {get: {responses: {'200': {description: Genesis}}}}
  /eth/v1/config/spec: {get: {responses: {'200': {description: Spec values}}}}
  /eth/v1/config/fork_schedule: {get: {responses: {'200': {description: Fork schedule}}}}
  /eth/v1/node/health: {get: {responses: {'200': {description: Healthy}}}}
  /eth/v1/node/syncing: {get: {responses: {'200': {description: Sync status}}}}
  /eth/v1/beacon/headers/{block_id}:
    get:
      parameters: [{$ref: '#/components/parameters/BlockID'}]
      responses: {'200': {description: Signed beacon block header}}
  /eth/v1/beacon/blocks/{block_id}:
    get:
      parameters: [{$ref: '#/components/parameters/BlockID'}]
      responses: {'200': {description: Signed beacon block in JSON or SSZ}}
  /eth/v1/beacon/blobs/{block_id}:
    get:
      parameters:
        - {$ref: '#/components/parameters/BlockID'}
        - {$ref: '#/components/parameters/VersionedHashes'}
      responses:
        '200':
          description: Blobs in block commitment order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BlobsResponse'}
            application/octet-stream:
              schema: {type: string, format: binary}
  /eth/v1/beacon/blob_sidecars/{block_id}:
    get:
      parameters:
        - {$ref: '#/components/parameters/BlockID'}
        - {$ref: '#/components/parameters/Indices'}
      responses: {'200': {description: Blob sidecars}}
  /eth/v1/beacon/data_column_sidecars/{block_id}:
    get:
      parameters: [{$ref: '#/components/parameters/BlockID'}]
      responses: {'200': {description: Fulu data column sidecars in JSON or SSZ}}
  /eth/v1/events: {get: {responses: {'200': {description: Server-sent events}}}}
components:
  parameters:
    BlockID:
      in: path
      name: block_id
      required: true
      schema: {type: string}
    VersionedHashes:
      in: query
      name: versioned_hashes
      required: false
      schema:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: '^0x[a-fA-F0-9]{64}$'
    Indices:
      in: query
      name: indices
      required: false
      schema:
        type: array
        uniqueItems: true
        items: {type: string, pattern: '^[0-9]+$'}
  schemas:
    BlobsResponse:
      type: object
      required: [execution_optimistic, finalized, data]
      properties:
        execution_optimistic: {type: boolean}
        finalized: {type: boolean}
        data:
          type: array
          items:
            type: string
            pattern: '^0x[a-fA-F0-9]{262144}$'
